syntax = "proto3";

package message;

//公共错误码定义(与 C++ 里的 enum 保持一致)
enum ErrorCodes {
    SUCCESS = 0;
    ItemEditConflict = 1051; // 图元版本冲突或目标不存在。
    ItemEditInvalidArgument = 1052; // 图元编辑参数无效。

    // --- 基础/系统错误 (1001 - 1019) ---
    Error_Json = 1001;        // Json解析错误
    RPCFailed = 1002;         // RPC请求错误 (网络或服务不可达)
    VarifyExpired = 1003;     // 验证码过期
    VarifyCodeErr = 1004;     // 验证码错误
    PasswdErr = 1006;         // 密码错误
    EmailNotMatch = 1007;     // 邮箱不匹配
    PasswdUpFailed = 1008;    // 更新密码失败
    PasswdInvalid = 1009;     // 密码格式无效
    TokenInvalid = 1010;      // Token无效 (过期或伪造)
    UidInvalid = 1011;        // UID无效
    LoginErr = 1013;          // 登录失败 (泛指)
    
    ServerInternalErr = 1014; // 服务器内部错误 (未知异常)
    RedisErr = 1015;          // Redis 操作失败 (连接断开或写入失败)
    MysqlErr = 1016;          // Mysql 操作失败

    // --- 用户/关系相关 (1020 - 1039) ---
    UserExist = 1005;         // 用户已经存在 (注册时)
    UserNotExist = 1012;      // 用户不存在
    AlreadyFriend = 1020;     // 已经是好友
    FriendOffline = 1021;     // 好友不在线
    TargetUserBusy = 1022;    // 对方忙碌
    
    // --- 房间/画板相关 (1040 - 1059) ---
    RoomCreateFailed = 1040;  // 创建房间失败 (写入Redis失败等)
    RoomNotExist = 1041;      // 房间不存在 (房间号错误或已销毁)
    RoomAlreadyExist = 1042;  // 房间已存在 (ID冲突)
    RoomFull = 1043;          // 房间人数已满
    RoomClosing = 1049; // 房间正在解散，拒绝新的操作。
    OwnerMustDestroyRoom = 1050; // 房主必须解散房间，不能普通退出。
    RoomJoinFailed = 1044;    // 加入房间失败 (泛指)
    NotInRoom = 1045;         // 用户不在房间内 (非法操作)
    TextStateConflict = 1047; // 文字目标版本冲突或不存在
    TextInvalidArgument = 1048; // 文字内容或样式无效
    NotOwner = 1046;          // 权限不足 (非房主操作)
    
    // --- 房间语音相关错误 (1060 - 1069) ---
    VoiceTokenInvalidArgument = 1060; // 语音 Token 请求参数无效
    VoiceTokenConfigInvalid = 1061;   // LiveKit 配置缺失或无效
    VoiceTokenGenerateFailed = 1062;  // LiveKit Token 生成失败
    VoiceAuthFailed = 1063;           // 语音服务鉴权失败

    // --- 重定向协议 (3000+) ---
    // 这个不算错误，但通常作为 status 返回
    NeedRedirect = 3001;      // 需要重定向到其他 Server
}

// 消息ID (用于 TCP 长连接区分包类型)
enum MsgID {
    ID_UNKNOWN = 0;
    ID_ITEM_EDIT_REQ = 1040; // 通用图元编辑请求。
    ID_ITEM_EDIT_RSP = 1041; // 通用图元编辑确认及广播。
    ID_ITEM_CREATE_BATCH_REQ = 1042; // 复制粘贴的原子图元批量创建请求。
    ID_ITEM_CREATE_BATCH_RSP = 1043; // 批量创建确认、广播和历史回放。
    ID_LEAVE_ROOM_REQ = 1033; // 普通成员退出请求。
    ID_LEAVE_ROOM_RSP = 1034; // 普通成员退出完成。
    ID_DESTROY_ROOM_REQ = 1035; // 房主解散请求。
    ID_DESTROY_ROOM_RSP = 1036; // 房主解散完成。
    ID_ROOM_DESTROYED_BROADCAST = 1037; // 房间解散通知。
    ID_LOGIN_REQ = 1001;      // 客户端连接 CanvasServer 发送的认证包
    ID_LOGIN_RSP = 1002;
    ID_DRAW_REQ = 1003;       // 绘画请求
    ID_DRAW_RSP = 1004;       // 广播绘画数据
    ID_CLEAR_REQ = 1005;      // 清屏请求
    ID_CLEAR_RSP = 1006;      // 广播清屏
    ID_TEXT_OPERATION_REQ = 1031; // 文字操作请求
    ID_TEXT_OPERATION_RSP = 1032; // 文字确认和广播
    ID_IMAGE_OPERATION_REQ = 1027; // 图片结构化操作请求，不携带图片二进制
    ID_IMAGE_OPERATION_RSP = 1028; // 图片结构化操作广播，房间历史按此消息类型回放
}

// 验证码服务 (VarifyServer 实现)
service VarifyService
{
  rpc GetVarifyCode (GetVarifyReq) returns (GetVarifyRsp) {}
}

// 逻辑业务服务 (LogicServer 实现)
service LogicService
{
    // 原子撤销本次登录，重复注销安全。
    rpc Logout (LogoutReq) returns (LogoutRsp) {}
    // 注册账号
    rpc RegisterUser (RegisterReq) returns (RegisterRsp) {} 

    // 重置密码
    rpc ResetPassword (ResetPasswordReq) returns (ResetPasswordRsp) {}

    // 登录账号 (同时返回 CanvasServer 地址和 Token)
	rpc Login (LoginReq) returns (LoginRsp);

    // [预留] 验证 Token (供 CanvasServer 内部调用，客户端不调这个)
    rpc VerifyToken (VerifyTokenReq) returns (VerifyTokenRsp) {}

    // 更新头像接口
    rpc UpdateAvatar (UpdateAvatarReq) returns (UpdateAvatarRsp);
}

message UserInfo {
    int32 uid = 1;
    string name = 2;
    string email = 3;
    int32 _sex = 4;
    string avatar_url = 5;
    string signature = 6;
}

message GetVarifyReq
{
  string email = 1;
}

message GetVarifyRsp
{
  int32 error = 1;
  string email = 2;
  string code = 3;
}


// --- 注册相关消息 ---
message RegisterReq
{
    string name = 1;         // 昵称
    string email = 2;        // 邮箱
    string passwd = 3;       // 密码(通常是加密后的)
    string confirm_pwd = 4;  // 确认密码(可选，通常在客户端或网关层校验，但传过来也没事)
    string varifycode = 5;   // 用户输入的验证码(用于逻辑服校验Redis)
}

message RegisterRsp
{
    int32 error = 1;         // 错误码
    int32 uid = 2;           // 注册成功后返回的新用户ID
}

// 重置密码
message ResetPasswordReq
{
    string email = 1;        // 邮箱
    string varifycode = 2;   // 验证码
    string passwd = 3;       // 新密码
    string confirm_pwd = 4;  // 确认新密码
}

message ResetPasswordRsp
{
    int32 error = 1;         // 错误码
}

// --- 登录相关消息 ---
message LoginReq
{
    string email = 1;
    string passwd = 2;
}

message LoginRsp
{
    int32 error = 1;
    int32 uid = 2;           // 用户ID
    string token = 3;        // 登录凭证(非常重要，用于后续长连接鉴权)
    string name = 4;         // 昵称
    string avatar = 5;       // 头像URL/路径
    string host = 6;         // 告诉客户端去连哪个画板服
    string port = 7;
}

message VerifyTokenReq {
    int32 uid = 1;
    string token = 2;
}

// --- Token 验证 (Server 内部交互用) ---
message VerifyTokenRsp {
    int32 error = 1; 
    int32 uid = 2;
}

// 加入房间请求
message JoinRoomReq {
    int32 uid = 1;          // 谁要进？
    string room_id = 2;     // 房间号 (例如 "604640")
}

// 加入房间响应
message JoinRoomRsp {
    int32 error = 1;        // 结果
    string room_id = 2;     // 房间号
    string room_name = 3;   // 房间名
    int32 owner_uid = 4;    // 房主ID
    
    // 画布尺寸，确保所有人坐标系一致
    int32 canvas_width = 5; 
    int32 canvas_height = 6;

    string redirect_host = 7; // 目标服务器 IP
    int32 redirect_port = 8;  // 目标服务器 Port

    // 客户端收到后，应清空现有列表并用此列表填充
    repeated UserInfo member_list = 9;
}

// 广播：有人加入了
message UserJoinRoomBroadcast {
    UserInfo user_info = 1;     // 直接包含用户信息，客户端可以直接用来 add item
}

// 广播：有人离开了
message UserLeaveRoomBroadcast {
    string room_id = 3; // 成员离开的房间，旧客户端忽略该追加字段。
    int32 uid = 1;          // 离开的人的 UID
    string reason = 2;      // 离开原因
}

// --- 房间编辑权限相关 ---
message GrantEditReq {
    int32 operator_uid = 1; // 发起授权的用户，必须是房主
    string room_id = 2;
    int32 target_uid = 3;   // 被授权编辑的用户
}

message GrantEditRsp {
    int32 error = 1;
    string room_id = 2;
    int32 target_uid = 3;
    bool can_edit = 4;
}

message RevokeEditReq {
    int32 operator_uid = 1; // 发起取消授权的用户，必须是房主
    string room_id = 2;
    int32 target_uid = 3;   // 被取消编辑权限的用户
}

message RevokeEditRsp {
    int32 error = 1;
    string room_id = 2;
    int32 target_uid = 3;
    bool can_edit = 4;
}

message PermissionChangedBroadcast {
    string room_id = 1;
    int32 target_uid = 2;
    bool can_edit = 3;
    int32 operator_uid = 4;
}

// 更新头像请求
message UpdateAvatarReq {
    int32 uid = 1;
    string avatar_url = 2;
}

// 更新头像回包
message UpdateAvatarRsp {
    int32 error = 1;
    int32 uid = 2;
}

// ============================================================
// 1. 枚举定义
// ============================================================

// 绘画指令状态
enum DrawCmd {
    CMD_UNKNOWN = 0;
    CMD_START = 1;      // 鼠标按下：开始画
    CMD_MOVE = 2;       // 鼠标拖拽：【核心】用于实时预览 (Server 只转发不存库)
    CMD_END = 3;        // 鼠标松开：最终确定 (Server 存入数据库/历史记录)
    CMD_UNDO = 4;       // 撤销
    CMD_CLEAR = 5;      // 清空
}

// 图元类型
enum ShapeType {
    SHAPE_UNKNOWN = 0;
    SHAPE_PEN = 1;      // 自由画笔 (曲线)
    SHAPE_RECT = 2;     // 矩形
    SHAPE_OVAL = 3;     // 椭圆
    SHAPE_LINE = 4;     // 直线
    SHAPE_ERASER = 5;   // 橡皮擦
    SHAPE_ARROW = 6;    // 单向箭头
    SHAPE_DIAMOND = 7;  // 菱形
}

// ============================================================
// 2. 核心绘画请求
// ============================================================

message DrawReq {
    // --- 身份识别 ---
    int32 uid = 1;          // 谁画的
    string item_id = 2;     // 【核心】图元UUID (客户端生成，用于识别是在修改同一个图元)
    
    // --- 状态与类型 ---
    DrawCmd cmd = 3;        // START / MOVE / END
    ShapeType shape = 4;    // RECT / OVAL ...

    // --- 样式属性 ---
    int32 color = 5;        // 0xAARRGGBB
    int32 width = 6;        // 线宽
    int32 pen_style = 7;    // (可选) 虚线/实线等

    // --- 坐标数据 ---
    
    // 【方案 A：几何图形专用 (Rect/Oval/Line/Arrow/Diamond)】
    // 只需要两个点：[起点] 和 [当前鼠标位置]
    // 接收端逻辑：QRectF(QPointF(start_x, start_y), QPointF(current_x, current_y))
    float start_x = 8;
    float start_y = 9;
    float current_x = 10;
    float current_y = 11;

    // 【方案 B：自由画笔专用 (Pen/Eraser)】
    // 自由画笔是“一串点”，不能只传起点终点
    // 在 MOVE 状态下，这里传输“自上次发包以来新增的点”
    message Point {
        float x = 1;
        float y = 2;
    }
    repeated Point path_points = 12; 

    // --- 延迟测量 ---
    uint64 send_timestamp_ms = 13;  // 发送方时间戳（毫秒），用于单向延迟测量
}

// 图片结构化操作类型。图片内容通过 OSS 传输，本枚举只描述画布状态变化。
enum ImageOperationType {
    IMAGE_OPERATION_UNKNOWN = 0; // 未知操作，服务端必须拒绝
    IMAGE_CREATE = 1;            // 创建图片图元，同时引用已经上传成功的资源
    IMAGE_UPDATE_TRANSFORM = 2;  // 更新图片图元的位置、尺寸、缩放或旋转
    IMAGE_DELETE = 3;            // 删除已有图片图元
}

// 图片图元的几何变换。坐标和尺寸使用画布场景坐标，旋转单位为角度。
message ImageTransform {
    float x = 1;         // 图元左上角 X 坐标，不能为 NaN 或无穷大
    float y = 2;         // 图元左上角 Y 坐标，不能为 NaN 或无穷大
    float width = 3;     // 图元显示宽度，服务端限制为正数
    float height = 4;    // 图元显示高度，服务端限制为正数
    float scale_x = 5;   // X 方向缩放系数，默认值为 1
    float scale_y = 6;   // Y 方向缩放系数，默认值为 1
    float rotation = 7;  // 顺时针旋转角度，服务端限制合理范围
}

// 图片图元及其资源引用。asset_ref 不是本地路径，也不能包含临时签名。
message ImageItem {
    string item_id = 1;          // 图元 UUID，在房间内必须唯一
    string asset_id = 2;         // OSS 资源 ID，由 GateServer 生成
    string asset_ref = 3;        // 稳定资源引用，接收端通过 GateServer 获取下载签名
    string asset_sha256 = 4;     // 图片内容 SHA-256 十六进制摘要，用于缓存和完整性校验
    string mime_type = 5;        // 允许的图片 MIME 类型，例如 image/png
    uint32 original_width = 6;   // 原始图片宽度，单位为像素
    uint32 original_height = 7;  // 原始图片高度，单位为像素
    ImageTransform transform = 8; // 当前图元的场景变换
}

// 房间内的图片操作。该消息只通过 Canvas TCP 传输元数据，不包含图片二进制、密钥或本地路径。
message ImageOperation {
    int32 uid = 1;                         // 发起操作的用户 ID，服务端必须与 Session UID 一致
    string room_id = 2;                    // 目标房间号，用于防止跨房间提交操作
    string operation_id = 3;               // 客户端生成的操作 UUID，用于去重和日志关联
    ImageOperationType operation_type = 4; // 创建、更新变换或删除
    ImageItem item = 5;                    // 创建和更新时使用的图片图元数据
    string target_item_id = 6;             // 删除时指定的目标图元 ID，其他操作可为空
    uint64 server_sequence = 7;            // 服务端规范化后的房间顺序号，客户端提交时必须为 0
}

//--群聊--
message ChatReq {
  uint64 uid = 1;
  string room_id = 2;     // 做串房间校验
  string content = 3;
  uint64 client_ts = 4;
}

message ChatRsp {
  uint64 uid = 1;
  string name = 2;
  string avatar_url = 3;
  string room_id = 4;
  string content = 5;
  uint64 server_ts = 6;
}

// 文字独立于绘画路径和图片资源，完整内容只在结束编辑时提交。
enum TextOperationType {
    TEXT_OPERATION_UNKNOWN = 0; // 未知操作
    TEXT_CREATE = 1; // 创建文字
    TEXT_UPDATE = 2; // 更新内容和统一样式
    TEXT_MOVE = 3; // 只更新位置
    TEXT_DELETE = 4; // 删除文字
}
message TextItem {
    string item_id = 1; // 稳定图元标识
    string text = 2; // UTF-8 纯文本，最多 16 KiB
    string font_family = 3; // 请求字体名称
    uint32 font_size = 4; // 场景像素字号，8 至 144
    uint32 color = 5; // ARGB 全文颜色
    bool bold = 6; // 全文加粗
    double x = 7; // 原始场景位置
    double y = 8; // 原始场景位置
}
message TextOperation {
    int32 uid = 1; // 必须匹配已登录会话
    string room_id = 2; // 必须匹配会话所在房间
    string operation_id = 3; // 操作关联标识
    TextOperationType operation_type = 4; // 创建、修改、移动、删除
    TextItem item = 5; // 对应操作所需字段
    string target_item_id = 6; // 操作目标
    uint64 server_sequence = 7; // 服务端规范化顺序，客户端不指定
    uint64 expected_sequence = 8; // 撤销所要求的目标版本，普通操作为零
}
message TextOperationRsp {
    int32 error = 1; // 沿用公共错误码
    TextOperation operation = 2; // 关联请求和规范化顺序
    TextItem current_item = 3; // 当前完整状态，不存在时省略
    string error_message = 4; // 可显示的失败原因
}

// 房间退出使用请求关联，重复发送不会重复清理后续会话。
message LeaveRoomReq {
    string room_id = 1; // 目标房间号。
    string request_id = 2; // 本次退出 UUID，重试保持不变。
}
message LeaveRoomRsp {
    int32 error = 1; // 服务端处理结果。
    string room_id = 2; // 本次退出的房间号。
    string request_id = 3; // 原样返回的请求关联。
}
message DestroyRoomReq {
    string room_id = 1; // 房主请求解散的房间。
    string request_id = 2; // 本次解散 UUID。
}
message DestroyRoomRsp {
    int32 error = 1; // Redis 和内存清理完成后才返回成功。
    string room_id = 2; // 已处理的房间号。
    string request_id = 3; // 原样返回的请求关联。
}
message RoomDestroyedBroadcast {
    string room_id = 1; // 已解散的房间。
    int32 operator_uid = 2; // 发起解散的房主。
    string reason = 3; // 可显示的结束原因。
}
message LogoutReq {
    int32 uid = 1; // 当前账号 ID。
    string token = 2; // 仅撤销本次登录的凭据，不得写入日志。
    string request_id = 3; // 客户端注销 UUID。
}
message LogoutRsp {
    int32 error = 1; // Token 原子撤销的结果。
    int32 uid = 2; // 本次注销账号。
    string request_id = 3; // 原样返回的请求关联。
}

// 通用编辑与既有绘图类型保持数值对应；橡皮擦只保留编号，不允许编辑。
enum ItemKind {
    ITEM_UNKNOWN = 0; // 未知图元。
    ITEM_PEN = 1; // 画笔。
    ITEM_RECT = 2; // 矩形。
    ITEM_OVAL = 3; // 椭圆。
    ITEM_LINE = 4; // 直线。
    ITEM_ERASER = 5; // 橡皮擦，不接受编辑。
    ITEM_ARROW = 6; // 箭头。
    ITEM_DIAMOND = 7; // 菱形。
    ITEM_IMAGE = 8; // 图片。
    ITEM_TEXT = 9; // 独立文字。
}
message ItemEditState {
    string item_id = 1; // 稳定图元标识。
    ItemKind kind = 2; // 创建时确定的图元类型。
    double x = 3; // 图元位置 X。
    double y = 4; // 图元位置 Y。
    double origin_x = 5; // 旋转及缩放原点 X。
    double origin_y = 6; // 旋转及缩放原点 Y。
    double rotation = 7; // 顺时针旋转角度。
    double scale = 8; // Qt 独立缩放，正常初始值为 1。
    repeated double matrix = 9; // Qt QTransform 的九个分量，按 m11 到 m33 排列。
    repeated double geometry = 10; // 矩形四分量、线段四端点、图片/文字宽高、笔迹六分量仿射矩阵。
    string text = 11; // 独立文字或封闭图元内文字，最多 16 KiB。
    string font_family = 12; // 全文统一字体。
    uint32 font_size = 13; // 场景像素字号，8 至 144。
    uint32 color = 14; // 文字 ARGB 颜色。
    bool bold = 15; // 全文统一加粗。
}
message ItemEditOperation {
    int32 uid = 1; // 必须与已登录会话一致。
    string room_id = 2; // 必须与当前房间一致。
    string operation_id = 3; // 客户端请求标识，重试沿用以保证幂等。
    string target_item_id = 4; // 操作目标。
    uint64 expected_revision = 5; // 严格匹配目标版本，零也参与比较。
    ItemEditState state = 6; // 待修改字段的绝对状态。
    uint32 fields = 7; // 位掩码：1 为几何，2 为文字，可组合原子提交。
    uint64 revision = 8; // 服务端赋值的已确认版本。
    bool preview = 9; // 拖动预览不推进版本、不写历史、不等待确认；缺省为最终提交。
    bool cancel_preview = 10; // 仅与 preview 同用，撤销同一 operation_id 的临时预览。
}
message ItemEditOperationRsp {
    int32 error = 1; // 公共错误码。
    ItemEditOperation operation = 2; // 关联原请求及规范版本。
    ItemEditState current_state = 3; // 目标最新完整状态，不存在时省略。
    string error_message = 4; // 可显示的失败原因。
    ItemEditState confirmed_state = 5; // 预览对应的已提交状态，用于取消或断线超时恢复。
}

// 复制粘贴使用完整版本化 JSON，避免旧 Draw/Text/Image 创建消息丢失路径、附属文字或完整变换。
message ItemCreateItem {
    string item_id = 1; // 房间内唯一的新图元 ID。
    ItemKind kind = 2; // 图元类型，与 JSON 中 type 交叉校验。
    string item_json = 3; // UTF-8 CanvasItemSerializer JSON。
    uint32 stack_order = 4; // 批次内从底到顶的稳定顺序。
}
message ItemCreateBatch {
    int32 uid = 1; // 发起者 UID，必须匹配 TCP 会话。
    string room_id = 2; // 当前房间 ID，禁止跨房间提交。
    string operation_id = 3; // 客户端 UUID，重试时保持不变。
    uint32 payload_version = 4; // 当前完整图元载荷版本。
    repeated ItemCreateItem items = 5; // 一个原子粘贴批次中的全部图元。
    uint64 server_sequence = 6; // 服务端分配的批次顺序，客户端提交时为零。
}
message ItemCreateBatchRsp {
    int32 error = 1; // 公共错误码。
    ItemCreateBatch batch = 2; // 成功时为规范化批次，失败时保留关联字段。
    string error_message = 3; // 可显示的拒绝原因。
}
